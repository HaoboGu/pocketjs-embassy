[package]
name = "pocketjs-embassy"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
frame-profile = []
perf-no-cache = []
perf-baseline = ["perf-no-cache"]

[dependencies]
pocket-runtime = { git = "https://github.com/pocket-nexus/pocketjs", rev = "becc0e21b678384ec31efa2b4f8d0be3aeefad5f", default-features = false }
pocket-drivers = { git = "https://github.com/pocket-nexus/pocketjs", rev = "becc0e21b678384ec31efa2b4f8d0be3aeefad5f", default-features = false }

pocket-raster = { git = "https://github.com/pocket-nexus/pocketjs", rev = "becc0e21b678384ec31efa2b4f8d0be3aeefad5f", default-features = false }

pocket-render = { git = "https://github.com/pocket-nexus/pocketjs", rev = "becc0e21b678384ec31efa2b4f8d0be3aeefad5f", default-features = false }
heapless = { version = "0.9", features = ["serde"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
embassy-executor = { version = "0.10", features = ["platform-std", "executor-thread"] }
embassy-time = { version = "0.5", features = ["std", "generic-queue-8"] }
static_cell = "2"

[build-dependencies]
cc = "1.2"

[profile.release]
panic = "abort"

[patch."https://github.com/pocket-nexus/pocketjs"]
pocket-runtime = { path = ".deps/pocketjs/engine/runtime" }
pocket-drivers = { path = ".deps/pocketjs/engine/drivers" }
pocket-render = { path = ".deps/pocketjs/engine/render" }
pocket-raster = { path = ".deps/pocketjs/engine/raster" }
pocketjs-core = { path = ".deps/pocketjs/engine/core" }
pocket-spec = { path = ".deps/pocketjs/engine/spec" }
pocket-package = { path = ".deps/pocketjs/engine/package" }
pocket-media = { path = ".deps/pocketjs/engine/modules/media" }
