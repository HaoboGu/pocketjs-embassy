[package]
name = "pocketjs-embassy"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
frame-profile = []

[dependencies]
pocket-guest-rquickjs = { git = "https://github.com/HaoboGu/pocketjs", rev = "ce7569741ac57607fb1327651e5eed8b9256ca26", default-features = false, features = ["rust-alloc"] }
pocket-runtime = { git = "https://github.com/HaoboGu/pocketjs", rev = "ce7569741ac57607fb1327651e5eed8b9256ca26", default-features = false }
pocket-drivers = { git = "https://github.com/HaoboGu/pocketjs", rev = "ce7569741ac57607fb1327651e5eed8b9256ca26", default-features = false }

pocket-raster = { git = "https://github.com/HaoboGu/pocketjs", rev = "ce7569741ac57607fb1327651e5eed8b9256ca26", default-features = false }

pocket-render = { git = "https://github.com/HaoboGu/pocketjs", rev = "ce7569741ac57607fb1327651e5eed8b9256ca26", default-features = false }
heapless = "0.9"

rquickjs = { version = "0.14", default-features = false, features = ["rust-alloc", "disable-assertions"] }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
embassy-executor = { version = "0.10", features = ["platform-std", "executor-thread"] }
embassy-time = { version = "0.5", features = ["std", "generic-queue-8"] }
static_cell = "2"

[target.'cfg(target_os = "none")'.dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["bindgen"] }

[build-dependencies]
cc = "1.2"

[profile.release]
panic = "abort"
