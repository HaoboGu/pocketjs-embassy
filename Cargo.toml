[package]
name = "pocketjs-embassy"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
frame-profile = []
perf-no-cache = []
perf-baseline = ["perf-no-cache"]

[dependencies]
pocket-guest-rquickjs = { git = "https://github.com/HaoboGu/pocketjs", rev = "acddb19a9544e57c3d6995602b3433d105a9929d", default-features = false, features = ["rust-alloc"] }
pocket-runtime = { git = "https://github.com/HaoboGu/pocketjs", rev = "acddb19a9544e57c3d6995602b3433d105a9929d", default-features = false }
pocket-drivers = { git = "https://github.com/HaoboGu/pocketjs", rev = "acddb19a9544e57c3d6995602b3433d105a9929d", default-features = false }

pocket-raster = { git = "https://github.com/HaoboGu/pocketjs", rev = "acddb19a9544e57c3d6995602b3433d105a9929d", default-features = false }

pocket-render = { git = "https://github.com/HaoboGu/pocketjs", rev = "acddb19a9544e57c3d6995602b3433d105a9929d", default-features = false }
heapless = { version = "0.9", features = ["serde"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

rquickjs = { version = "0.14", default-features = false, features = ["rust-alloc", "disable-assertions"] }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
embassy-executor = { version = "0.10", features = ["platform-std", "executor-thread"] }
embassy-time = { version = "0.5", features = ["std", "generic-queue-8"] }
static_cell = "2"

[target.'cfg(target_os = "none")'.dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["bindgen"] }

[build-dependencies]
cc = "1.2"

[profile.release]
panic = "abort"

[patch."https://github.com/HaoboGu/pocketjs"]
pocket-runtime = { path = ".deps/pocketjs/engine/runtime" }
pocket-drivers = { path = ".deps/pocketjs/engine/drivers" }
pocket-render = { path = ".deps/pocketjs/engine/render" }
pocket-raster = { path = ".deps/pocketjs/engine/raster" }
pocketjs-core = { path = ".deps/pocketjs/engine/core" }
pocket-spec = { path = ".deps/pocketjs/engine/spec" }
pocket-package = { path = ".deps/pocketjs/engine/package" }
pocket-media = { path = ".deps/pocketjs/engine/modules/media" }
