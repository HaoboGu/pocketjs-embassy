[package]
name = "rmk-mosaico-quickjs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = ["vial"]
vial = ["rmk/vial"]
rynk = ["rmk/rynk"]
frame-benchmark = ["usb-diagnostics"]
ppa-probe = ["frame-benchmark", "dep:esp32s31-pac"]
ppa-render = ["dep:esp32s31-pac", "dep:pocket-raster", "dep:pocket-drivers"]
perf-no-cache = ["frame-benchmark", "pocketjs-embassy/perf-no-cache"]
perf-baseline = ["perf-no-cache", "pocketjs-embassy/perf-baseline"]
usb-diagnostics = ["esp-backtrace/custom-pre-backtrace", "pocketjs-embassy/frame-profile"]

[[bin]]
name = "rmk-mosaico-quickjs"
test = false
bench = false

[dependencies]
pocket-embassy = { git = "https://github.com/HaoboGu/pocketjs", rev = "acddb19a9544e57c3d6995602b3433d105a9929d", default-features = false, features = ["runner"] }
pocket-raster = { path = "../../.deps/pocketjs/engine/raster", optional = true }
pocket-render = { path = "../../.deps/pocketjs/engine/render" }
pocket-drivers = { path = "../../.deps/pocketjs/engine/drivers", optional = true }
esp32s31-pac = { package = "esp32s31", git = "https://github.com/esp-rs/esp-pacs.git", rev = "5cb8c50", optional = true }
pocketjs-embassy = { path = "../.." }
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "c7195de6fe994da3651fdc20ee358ca4e69de11d", default-features = false, features = [
    "esp32s31_ble",
    "log",
    "storage",
    "dongle",
    "split",
    "display",
] }
embassy-executor = "0.10"
esp-alloc = { version = "0.11", default-features = false, features = ["compat"] }
esp-backtrace = { version = "0.20", features = ["esp32s31", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s31", "log-04"] }
esp-hal = { version = "=1.2.0", features = ["esp32s31", "unstable"] }
esp-println = { version = "0.18", default-features = false, features = ["esp32s31", "log-04", "uart"] }
esp-radio = { version = "1.0.0-beta.2", features = ["esp32s31", "unstable", "ble"] }
esp-rtos = { version = "0.4", features = ["esp32s31", "esp-radio", "embassy"] }
esp-storage = { version = "0.10", features = ["embedded-storage", "esp32s31"] }
bt-hci = "0.11"
static_cell = "2"
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-sync = "0.8"
embassy-usb = "0.6"
embedded-graphics = "0.8"
heapless = "0.9"
log = "0.4"

[profile.dev]
opt-level = "s"

[profile.dev.package.esp-storage]
opt-level = 3

# Official upstream merge of esp-rs/esp-hal#6615; keep the ESP crates on one revision.
[patch.crates-io]
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "c38ad27aa5e0894f3447624b63463c9e7d5c1e95" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "c38ad27aa5e0894f3447624b63463c9e7d5c1e95" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", rev = "c38ad27aa5e0894f3447624b63463c9e7d5c1e95" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "c38ad27aa5e0894f3447624b63463c9e7d5c1e95" }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "c38ad27aa5e0894f3447624b63463c9e7d5c1e95" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "c38ad27aa5e0894f3447624b63463c9e7d5c1e95" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", rev = "c38ad27aa5e0894f3447624b63463c9e7d5c1e95" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", rev = "c38ad27aa5e0894f3447624b63463c9e7d5c1e95" }

[profile.release]
codegen-units = 1
debug = 2
lto = "thin"
opt-level = 3

[patch."https://github.com/HaoboGu/pocketjs"]
pocket-runtime = { path = "../../.deps/pocketjs/engine/runtime" }
pocket-drivers = { path = "../../.deps/pocketjs/engine/drivers" }
pocket-render = { path = "../../.deps/pocketjs/engine/render" }
pocket-raster = { path = "../../.deps/pocketjs/engine/raster" }
pocketjs-core = { path = "../../.deps/pocketjs/engine/core" }
pocket-spec = { path = "../../.deps/pocketjs/engine/spec" }
pocket-package = { path = "../../.deps/pocketjs/engine/package" }
pocket-media = { path = "../../.deps/pocketjs/engine/modules/media" }

# Only the unmerged retained dongle-state event is patched locally.
[patch."https://github.com/rmk-rs/rmk"]
rmk = { path = "../../.deps/rmk/rmk" }

[profile.release.package.rquickjs-sys]
opt-level = 2
